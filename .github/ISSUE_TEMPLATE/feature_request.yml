name: Feature Request
description: Suggest an improvement to the Replane documentation website
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please fill out the form below to help us understand your idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I couldn't find information about...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the improvement you'd like.
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered.
      placeholder: Other approaches you've thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Documentation Area
      description: Which area does this improvement relate to?
      options:
        - Getting Started
        - Concepts
        - Guides
        - SDK Documentation
        - API Reference
        - Self-Hosting
        - Blog
        - Search
        - Navigation/UX
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the improvement here.
    validations:
      required: false

